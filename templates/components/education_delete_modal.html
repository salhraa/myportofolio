<button type="button"
        class="btn-pixel btn-pixel-secondary"
        style="background-color: #d90429; color: white;"
        popovertarget="delete-education-{{ education.id }}"
        aria-label="Hapus {{ education.institution }}"
        title="Hapus riwayat pendidikan">
    Hapus
</button>

<div id="delete-education-{{ education.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-education-title-{{ education.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-education-{{ education.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-education-{{ education.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-education-title-{{ education.id }}">Hapus Pendidikan?</h2>
        <p>
            Apakah Anda yakin ingin menghapus riwayat pendidikan di
            <strong>{{ education.institution }}</strong>?
        </p>
        <div class="project-delete-modal__actions" style="margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: flex-end;">
            <button type="button"
                    class="btn-pixel btn-pixel-secondary"
                    popovertarget="delete-education-{{ education.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_education' education.id %}">
                {% csrf_token %}
                <button type="submit" class="btn-pixel" style="background-color: #d90429; color: white;">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
