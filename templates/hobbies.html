{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_hobbies' %}">My World</a>
            </nav>
        </div>
    </header>
    {% block content %}
   
    <main class="pixel-main">
        <section class="hobby-section" id="hobbies">
            <div class="container">

                <h1 class="pixel-title">MY WORLD</h1>

                <div class="hobby-grid">
                    <article class="hobby-card">
                        <span class="hobby-category-badge">Daily Package</span>
                        <h2 class="pixel-subtitle">Arts</h2>

                        <!-- UNLOCK -->
                        <button
                            type="button"
                            id="unlockBtn"
                            class="pixel-btn unlock-main-btn"
                            onclick="unlockGallery()">
                            [ UNLOCK ]
                        </button>


                        <!-- MENU ART -->
                        <div id="artMenuList" class="art-menu-list" style="display: none;">

                            <button
                                type="button"
                                class="pixel-btn art-item-btn"
                                data-src="{% static 'img/river.jpeg' %}"
                                data-title="Golden River"
                                data-desc="Just go with the flow. The future is ours to build!"
                                onclick="openArtPreviewFromBtn(this)">
                                01
                            </button>

                            <button
                                type="button"
                                class="pixel-btn art-item-btn"
                                data-src="{% static 'img/watched.jpeg' %}"
                                data-title="Watched by Shadows"
                                data-desc="Keep your inner flame burning!"
                                onclick="openArtPreviewFromBtn(this)">
                                02
                            </button>

                            <button
                                type="button"
                                class="pixel-btn art-item-btn"
                                data-src="{% static 'img/see.jpeg' %}"
                                data-title="What we see?"
                                data-desc="Actually, I don't know what happened."
                                onclick="openArtPreviewFromBtn(this)">
                                03
                            </button>

                            <button
                                type="button"
                                class="pixel-btn close-btn"
                                onclick="closeAllGallery()">
                                [ CLOSE ] ✖
                            </button>

                        </div>


                        <!-- ART PREVIEW -->
                        <div
                            id="artPreviewBox"
                            class="art-preview-box"
                            style="display: none;">

                            <div class="cute-frame-header">
                                <span class="cute-dot pink"></span>
                                <span class="cute-dot yellow"></span>
                                <span class="cute-dot green"></span>
                            </div>

                            <div class="cute-img-container">
                                <img id="displayImage" src="" alt="Art Display" class="cute-img">
                            </div>

                            <div class="cute-caption-box">
                                <h3 id="displayTitle" class="cute-art-title"></h3>
                                <p id="displayDesc" class="cute-art-desc"></p>
                            </div>

                            <button
                                type="button"
                                class="pixel-btn close-btn preview-close-btn"
                                onclick="closeArtPreview()">
                                [ CLOSE PREVIEW ] 
                            </button>


                        </div>

                    </article>
                </div>

            </div>
        </section>
    </main>


    <script>
    function unlockGallery() {
        // Hilangkan UNLOCK
        document.getElementById('unlockBtn').style.display = 'none';

        // BARU tampilkan 01, 02, 03, CLOSE
        document.getElementById('artMenuList').style.display = 'block';

        // Pastikan art belum muncul
        document.getElementById('artPreviewBox').style.display = 'none';
    }


    function openArtPreviewFromBtn(btn) {
        const imgUrl = btn.dataset.src;
        const title = btn.dataset.title;
        const desc = btn.dataset.desc;

        document.getElementById('displayImage').src = imgUrl;
        document.getElementById('displayTitle').textContent = title;
        document.getElementById('displayDesc').textContent = desc;

        // Tampilkan art
        document.getElementById('artPreviewBox').style.display = 'block';
    }


    function closeArtPreview() {
        // Tutup art
        document.getElementById('artPreviewBox').style.display = 'none';

        document.getElementById('displayImage').src = '';
    }


    function closeAllGallery() {
        // Sembunyikan menu 01, 02, 03, CLOSE
        document.getElementById('artMenuList').style.display = 'none';

        // Sembunyikan art
        document.getElementById('artPreviewBox').style.display = 'none';

        // Tampilkan UNLOCK lagi
        document.getElementById('unlockBtn').style.display = 'block';
    }
    </script>

    {% endblock %}


    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
